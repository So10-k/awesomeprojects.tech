<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="awesomeprojects.tech: free subdomains for the things you build">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#16123a"/>
      <stop offset="1" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf7d4"/>
      <stop offset="0.5" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="640" cy="190" rx="520" ry="170" fill="url(#glow)"/>
  <circle cx="160" cy="80" r="70" fill="#7cf7d4" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1130" cy="320" r="90" fill="#ff7ad9" opacity="0.18" filter="url(#soft)"/>
  <!-- little constellation of subdomains -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c9d4ff" fill-opacity="0.45">
    <text x="70" y="330">portfolio.</text>
    <text x="1040" y="72">my-game.</text>
    <text x="1090" y="250">blog.</text>
    <text x="64" y="110">api-docs.</text>
    <text x="930" y="360">hackathon.</text>
  </g>
  <text x="640" y="190" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="url(#ink)">awesomeprojects.tech</text>
  <text x="640" y="240" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#dfe6ff" fill-opacity="0.85">free subdomains for the things you build</text>
  <g transform="translate(440 278)">
    <rect width="400" height="52" rx="26" fill="#0b1020" fill-opacity="0.7" stroke="url(#ink)" stroke-width="2"/>
    <text x="200" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#ffffff"><tspan fill="#7cf7d4">you</tspan>.awesomeprojects.tech</text>
  </g>
</svg>
