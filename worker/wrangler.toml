# The panel backend: https://api.awesomeprojects.tech  (deployed by .github/workflows/panel.yml)
name = "awesomeprojects-panel"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "2f8365ea25e7fd8c95ba7da82046b81c"
workers_dev = false
routes = [{ pattern = "api.awesomeprojects.tech", custom_domain = true }]

[triggers]
crons = ["17 * * * *"] # hourly: close stale private requests

[vars]
REPO = "So10-k/awesomeprojects.tech"
SITE_ORIGIN = "https://awesomeprojects.tech"
EXTRA_ORIGINS = "http://localhost:5191"
# The managed-user enterprise (slug) and our SAML issuer. Leave EMU_ENTERPRISE empty until it exists.
EMU_ENTERPRISE = ""
SAML_ISSUER = "https://api.awesomeprojects.tech/saml"

# Jobs, rate limits and the private audit log. The deploy workflow fills in the id.
[[kv_namespaces]]
binding = "PANEL"
id = "__PANEL_KV_ID__"

# d1-start: requests, notes and the audit log (strongly consistent). The deploy workflow fills in the id.
[[d1_databases]]
binding = "DB"
database_name = "awesomeprojects-panel"
database_id = "__PANEL_D1_ID__"
migrations_dir = "migrations"
# d1-end
