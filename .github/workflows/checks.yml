name: Checks

# Domain/DNS validation on the public registry (no secrets — works for fork PRs).
# Bot/unit tests live in apjs-hosted-sites/platform.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'bot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.js
      - uses: ./.github/actions/dnscontrol
      - run: dnscontrol check
