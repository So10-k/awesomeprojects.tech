name: awesomeprojects.tech site build (Cloudflare Pages)

# Reusable: hosted sites in the managed-user enterprise call this. Two jobs on purpose:
#   build   runs the site's own code (npm install, the build) with NO secrets
#   deploy  only uploads the built files to Cloudflare Pages, with the Cloudflare token
# Site owners can't edit workflows (org ruleset), so the token never meets their code.
on:
  workflow_call:
    inputs:
      project:
        description: Cloudflare Pages project (ap-<name>)
        type: string
        required: true
    secrets:
      CLOUDFLARE_PAGES_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Get the build scripts
        uses: actions/checkout@v4
        with:
          repository: So10-k/awesomeprojects.tech
          ref: main
          path: .awesomeprojects
          sparse-checkout: scripts
          persist-credentials: false
      - id: plan
        run: node .awesomeprojects/scripts/site-build.js plan
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.node != ''
        with:
          node-version: ${{ steps.plan.outputs.node }}
      - if: steps.plan.outputs.pm == 'pnpm' || steps.plan.outputs.pm == 'yarn'
        run: corepack enable
      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.pm == 'bun'
      - name: Install
        if: steps.plan.outputs.install != ''
        working-directory: ${{ steps.plan.outputs.dir }}
        run: ${{ steps.plan.outputs.install }}
      - run: node .awesomeprojects/scripts/site-build.js prepare
      - name: Build
        if: steps.plan.outputs.build != ''
        working-directory: ${{ steps.plan.outputs.dir }}
        run: ${{ steps.plan.outputs.build }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - id: finish
        run: node .awesomeprojects/scripts/site-build.js finish
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ steps.finish.outputs.path }}
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static files only
        # A built site can't bring server code onto our Cloudflare account (Pages runs _worker.js / functions).
        run: |
          rm -rf site/_worker.js site/functions
          rm -f site/_routes.json
      - name: Publish to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
        env:
          PROJECT: ${{ inputs.project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
