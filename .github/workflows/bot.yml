name: Subdomain bot

# Request issues, PR reviews, /commands (issues, PRs, Discussions), transfers, takedowns,
# the activity log, and the weekly health check.
#
# Safety: this runs main's code with a write token, so it must NEVER check out or run a PR's code.
# scripts/bot.js only reads PR files as git objects + JSON.parse. Never interpolate PR/issue text
# into `run:` lines here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  discussion_comment:
    types: [created]
  repository_dispatch:
    types: [panel] # actions from the panel (api.awesomeprojects.tech)
  schedule:
    - cron: "17 9 * * 1" # Mondays: dangling-name health check
    - cron: "41 6 * * *" # daily: hosted-site ops
  workflow_dispatch:
    inputs:
      target:
        description: "What to run: pr <number> | issue <number> | health | bot-check | ops"
        required: true
        default: health

permissions:
  contents: write # bot-made transfer/takedown branches
  pull-requests: write
  issues: write
  statuses: write
  actions: write # start a deploy after merging
  discussions: write # the activity log, and answering commands in Discussions

concurrency:
  group: bot-${{ github.event.pull_request.number || github.event.issue.number || github.event.discussion.number || github.event.client_payload.target || github.run_id }}
  cancel-in-progress: false

jobs:
  bot:
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'discussion_comment') ||
      (startsWith(github.event.comment.body, '/') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          PANEL_API: https://api.awesomeprojects.tech
          PANEL_BOT_SECRET: ${{ secrets.PANEL_BOT_SECRET }}
          BOT_PAT: ${{ secrets.BOT_PAT }} # the bot account: only used for the sites org
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # optional notifications
          EMU_ADMIN_TOKEN: ${{ secrets.EMU_ADMIN_TOKEN }} # the managed enterprise's setup user (SCIM + org)
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }} # Pages projects for managed-enterprise sites
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
