name: Subdomain bot

# Thin runner on the public registry. Heavy code lives in apjs-hosted-sites/platform (private).
# Events stay here because issues/PRs/domains are public.
#
# Safety: never check out or run a PR's code. scripts/bot.js only reads PR files as git objects.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  discussion_comment:
    types: [created]
  repository_dispatch:
    types: [panel]
  schedule:
    - cron: "17 9 * * 1"
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "What to run: pr <number> | issue <number> | health | bot-check | ops"
        required: true
        default: health

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write
  discussions: write

# One queue per PR/issue for events that change it, but every command comment gets its own run:
# GitHub keeps only one *pending* run per group, so three quick commands on one issue used to drop the middle one.
concurrency:
  group: bot-${{ github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.event.pull_request.number || github.event.issue.number || github.event.discussion.number || github.event.client_payload.target || github.run_id }}
  cancel-in-progress: false

jobs:
  bot:
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'discussion_comment') ||
      (startsWith(github.event.comment.body, '/') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Public registry (domains, config)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Private platform (bot scripts)
        uses: actions/checkout@v4
        with:
          repository: apjs-hosted-sites/platform
          ref: main
          path: .platform
          token: ${{ secrets.BOT_PAT }}
          github-server-url: https://awesome-projects.ghe.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bot
        run: node "$PLATFORM_ROOT/scripts/bot.js"
        env:
          REPO_ROOT: ${{ github.workspace }}
          PLATFORM_ROOT: ${{ github.workspace }}/.platform
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          PANEL_API: https://api.awesomeprojects.tech
          PANEL_BOT_SECRET: ${{ secrets.PANEL_BOT_SECRET }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EMU_ADMIN_TOKEN: ${{ secrets.EMU_ADMIN_TOKEN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOM_HOOK_SECRET: ${{ secrets.ROOM_HOOK_SECRET }}

      # The panel server runs platform's worker/ code. When that code (or the enterprise settings) changed
      # since the last deploy, redeploy it. This runs hourly with the panel's sweep, so nobody has to remember.
      - name: Keep the panel server current
        if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(git -C .platform rev-parse --short=12 HEAD:worker)-$(node -e "process.stdout.write(JSON.stringify([require('./config.json').emu||{},require('./config.json').ghes||{}]))" | sha256sum | cut -c1-8)"
          live=$(curl -fsS -m 10 https://api.awesomeprojects.tech/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)
          if [ "$live" = "$v" ]; then echo "Panel is current ($v)."; exit 0; fi
          echo "Panel is ${live:-unknown}, platform is $v: redeploying."
          gh workflow run panel.yml -R "$GITHUB_REPOSITORY" --ref main
