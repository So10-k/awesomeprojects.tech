name: Subdomain bot

# Thin runner on the public registry. Heavy code lives in apjs-hosted-sites/platform (private).
# Events stay here because issues/PRs/domains are public.
#
# Safety: never check out or run a PR's code. scripts/bot.js only reads PR files as git objects.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]
  discussion_comment:
    types: [created]
  repository_dispatch:
    types: [panel]
  schedule:
    - cron: "17 9 * * 1"
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "What to run: pr <number> | issue <number> | health | bot-check | ops"
        required: true
        default: health

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write
  discussions: write

concurrency:
  group: bot-${{ github.event.pull_request.number || github.event.issue.number || github.event.discussion.number || github.event.client_payload.target || github.run_id }}
  cancel-in-progress: false

jobs:
  bot:
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'discussion_comment') ||
      (startsWith(github.event.comment.body, '/') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Public registry (domains, config)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Private platform (bot scripts)
        id: platform
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: apjs-hosted-sites/platform
          ref: main
          path: .platform
          token: ${{ secrets.BOT_PAT }}

      - name: Fall back to scripts in this repo
        if: steps.platform.outcome != 'success'
        run: |
          echo "::notice::Platform checkout failed; using scripts from this repo until bootstrap finishes."
          rm -rf .platform
          mkdir -p .platform
          cp -a scripts .platform/
          [ -d worker ] && cp -a worker .platform/
          [ -d templates ] && cp -a templates .platform/
          [ -d test ] && cp -a test .platform/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bot
        run: node "$PLATFORM_ROOT/scripts/bot.js"
        env:
          REPO_ROOT: ${{ github.workspace }}
          PLATFORM_ROOT: ${{ github.workspace }}/.platform
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          PANEL_API: https://api.awesomeprojects.tech
          PANEL_BOT_SECRET: ${{ secrets.PANEL_BOT_SECRET }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EMU_ADMIN_TOKEN: ${{ secrets.EMU_ADMIN_TOKEN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
