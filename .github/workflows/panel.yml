name: Panel server

# Thin runner: Worker code lives in apjs-hosted-sites/platform. Setup: docs/PANEL.md.
on:
  push:
    branches: [main]
    paths: [".github/workflows/panel.yml"]
  workflow_dispatch:
  repository_dispatch:
    types: [panel-deploy]

permissions:
  contents: read

concurrency:
  group: panel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - name: Check the setup
        id: ready
        env:
          S1: ${{ secrets.PANEL_GITHUB_CLIENT_ID }}
          S2: ${{ secrets.PANEL_GITHUB_CLIENT_SECRET }}
          S3: ${{ secrets.PANEL_DISPATCH_TOKEN }}
          S4: ${{ secrets.PANEL_SESSION_SECRET }}
          S5: ${{ secrets.PANEL_BOT_SECRET }}
          BOT: ${{ secrets.BOT_PAT }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_WORKERS_TOKEN"
          [ -n "$BOT" ] || missing="$missing BOT_PAT"
          [ -n "$S1" ] || missing="$missing PANEL_GITHUB_CLIENT_ID"
          [ -n "$S2" ] || missing="$missing PANEL_GITHUB_CLIENT_SECRET"
          [ -n "$S3" ] || missing="$missing PANEL_DISPATCH_TOKEN"
          [ -n "$S4" ] || missing="$missing PANEL_SESSION_SECRET"
          [ -n "$S5" ] || missing="$missing PANEL_BOT_SECRET"
          if [ -n "$missing" ]; then
            echo "::notice::Panel server not deployed yet. Missing repository secrets:$missing (see docs/PANEL.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Public registry (config)
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Private platform (worker)
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: apjs-hosted-sites/platform
          ref: main
          path: .platform
          token: ${{ secrets.BOT_PAT }}

      - name: Use registry config with platform worker
        if: steps.ready.outputs.ok == 'true'
        run: cp config.json .platform/config.json

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Make sure the KV namespace exists
        if: steps.ready.outputs.ok == 'true'
        working-directory: .platform/worker
        run: |
          set -euo pipefail
          title="awesomeprojects-panel"
          id=$(npx -y wrangler@4 kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));const n=l.find(x=>x.title==='$title');process.stdout.write(n?n.id:'')})")
          if [ -z "$id" ]; then
            npx -y wrangler@4 kv namespace create "$title" >/dev/null
            id=$(npx -y wrangler@4 kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));process.stdout.write(l.find(x=>x.title==='$title').id)})")
          fi
          sed -i "s/__PANEL_KV_ID__/$id/" wrangler.toml
          echo "KV namespace: $id"

      - name: Make sure the D1 database exists
        id: d1
        if: steps.ready.outputs.ok == 'true'
        working-directory: .platform/worker
        run: |
          set +e +o pipefail
          db="awesomeprojects-panel"
          find_id() { (npx -y wrangler@4 d1 list --json 2>/dev/null || true) | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const l=JSON.parse(s.slice(s.indexOf('[')));const n=l.find(x=>x.name==='$db');process.stdout.write(n?n.uuid:'')}catch{}})"; }
          id=$(find_id)
          if [ -z "$id" ]; then npx -y wrangler@4 d1 create "$db" >/dev/null 2>&1; id=$(find_id); fi
          if [ -n "$id" ]; then
            sed -i "s/__PANEL_D1_ID__/$id/" wrangler.toml
            npx -y wrangler@4 d1 migrations apply "$db" --remote || { echo "::error::Couldn't apply the D1 migrations."; exit 1; }
            echo "D1 database: $id"
          else
            sed -i '/# d1-start/,/# d1-end/d' wrangler.toml
            echo "::warning::Couldn't create or find the D1 database, so private requests are off. Give the CLOUDFLARE_WORKERS_TOKEN the 'D1: Edit' permission (Cloudflare → API Tokens → edit the token) and re-run this workflow."
          fi

      - name: Managed enterprise sign-in (config.json → emu.enterprise)
        if: steps.ready.outputs.ok == 'true'
        working-directory: .platform/worker
        run: |
          ent=$(node -e "process.stdout.write(String((require('../config.json').emu||{}).enterprise||'').replace(/[^a-z0-9-]/gi,''))")
          sed -i "s/^EMU_ENTERPRISE = .*/EMU_ENTERPRISE = \"$ent\"/" wrangler.toml
          code=$(node -e "process.stdout.write(String((require('../config.json').emu||{}).shortcode||'').replace(/[^a-z0-9]/gi,''))")
          sed -i "s/^EMU_SHORTCODE = .*/EMU_SHORTCODE = \"$code\"/" wrangler.toml
          echo "EMU enterprise: ${ent:-off}"

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: .platform/worker
        run: npx -y wrangler@4 deploy

      - name: Set the secrets
        if: steps.ready.outputs.ok == 'true'
        working-directory: .platform/worker
        env:
          GITHUB_CLIENT_ID: ${{ secrets.PANEL_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PANEL_GITHUB_CLIENT_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.PANEL_DISPATCH_TOKEN }}
          SESSION_SECRET: ${{ secrets.PANEL_SESSION_SECRET }}
          BOT_SECRET: ${{ secrets.PANEL_BOT_SECRET }}
          SAML_PRIVATE_KEY: ${{ secrets.PANEL_SAML_PRIVATE_KEY }}
          SAML_CERT: ${{ secrets.PANEL_SAML_CERT }}
        run: |
          set -euo pipefail
          umask 077
          f="$RUNNER_TEMP/panel-secrets.json"
          node -e "const k=['GITHUB_CLIENT_ID','GITHUB_CLIENT_SECRET','DISPATCH_TOKEN','SESSION_SECRET','BOT_SECRET','SAML_PRIVATE_KEY','SAML_CERT'];require('fs').writeFileSync(process.argv[1],JSON.stringify(Object.fromEntries(k.filter(x=>process.env[x]).map(x=>[x,process.env[x]]))))" "$f"
          npx -y wrangler@4 secret bulk "$f" >/dev/null
          rm -f "$f"
          echo "Secrets set."

      - name: Check it answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.awesomeprojects.tech/health; then echo; exit 0; fi
            sleep 10
          done
          echo "::warning::api.awesomeprojects.tech isn't answering yet (a new custom domain can take a few minutes)."
