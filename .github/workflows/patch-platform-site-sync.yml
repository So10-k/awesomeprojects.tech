name: Patch platform site-sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: node scripts/patch-platform-site-sync.js
